<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прогноз свойств для {{ steel_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function validateSum() {
            const fields = ['C','Mn','Si','P','S','Ni','Cr','Mo','Ti'];
            let sum = 0;

            fields.forEach(f => {
                const el = document.querySelector(`[name=${f}]`);
                if (el) {
                    const val = parseFloat(el.value) || 0;
                    sum += val;
                }
            });

            if (sum > 100) {
                alert('Сумма всех элементов не может превышать 100%');
                return false;
            }
            if (sum === 0) {
                alert('Сумма всех элементов должна быть больше 0%');
                return false;
            }
            return true;
        }
    </script>
</head>

<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">
        Прогноз свойств для {{ steel_name }}
    </h2>

    {% if errors %}
        <div class="alert alert-danger">
            <strong>Обнаружены ошибки в составе:</strong>
            <ul class="mb-0 mt-2">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST"
          class="mx-auto"
          style="max-width: 600px;"
          onsubmit="return validateSum()">

        {% csrf_token %}

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">C (%)</label>
                <input type="number" step="0.01" name="C" class="form-control"
                       value="{{ data.C|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">Mn (%)</label>
                <input type="number" step="0.01" name="Mn" class="form-control"
                       value="{{ data.Mn|default:0 }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Si (%)</label>
                <input type="number" step="0.01" name="Si" class="form-control"
                       value="{{ data.Si|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">P (%)</label>
                <input type="number" step="0.01" name="P" class="form-control"
                       value="{{ data.P|default:0 }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">S (%)</label>
                <input type="number" step="0.01" name="S" class="form-control"
                       value="{{ data.S|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">Ni (%)</label>
                <input type="number" step="0.01" name="Ni" class="form-control"
                       value="{{ data.Ni|default:0 }}">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Cr (%)</label>
                <input type="number" step="0.01" name="Cr" class="form-control"
                       value="{{ data.Cr|default:0 }}">
            </div>
            <div class="col">
                <label class="form-label">Mo (%)</label>
                <input type="number" step="0.01" name="Mo" class="form-control"
                       value="{{ data.Mo|default:0 }}">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <label class="form-label">Ti (%)</label>
                <input type="number" step="0.01" name="Ti" class="form-control"
                       value="{{ data.Ti|default:0 }}">
            </div>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">
                Прогнозировать
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'index' %}" class="btn btn-secondary btn-lg">
            На главную
        </a>
    </div>
</div>
</body>
</html>
