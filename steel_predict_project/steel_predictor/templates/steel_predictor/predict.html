<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прогноз свойств для {{ steel_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        // Валидация суммы
        function validateSum() {
            const fields = ['C','Mn','Si','P','S','Ni','Cr','Mo','Ti'];
            let sum = 0;

            fields.forEach(name => {
                const el = document.querySelector(`[name="${name}"]`);
                if (el) {
                    const v = parseFloat(el.value);
                    if (!isNaN(v)) sum += v;
                }
            });

            if (sum <= 0) {
                alert('Суммарное содержание элементов должно быть больше 0%');
                return false;
            }

            if (sum > 100) {
                alert('Суммарное содержание элементов слишком велико');
                return false;
            }

            return true;
        }

        // === ГОСТ → Марка → Диапазоны ===
        const gostData = {{ gost_data|safe }};

        function onGostChange() {
            const gost = document.getElementById('gost').value;
            const gradeSelect = document.getElementById('grade');

            gradeSelect.innerHTML = '<option value="">— не выбрана —</option>';

            if (!gost || !gostData[gost]) return;

            Object.keys(gostData[gost]).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                gradeSelect.appendChild(opt);
            });

            updateCompositionHint(); // очистка подсказок
        }

        function onGradeChange() {
            updateCompositionHint();
        }

        function updateCompositionHint() {
            const gost = document.getElementById('gost').value;
            const grade = document.getElementById('grade').value;
            const hintDiv = document.getElementById('composition-hint');

            hintDiv.innerHTML = ''; // очистка

            if (!gost || !grade || !gostData[gost][grade]) return;

            const ranges = gostData[gost][grade];
            const rows = [];
            Object.entries(ranges).forEach(([el, [min, max]]) => {
                // placeholder для поля ввода
                const input = document.querySelector(`[name="${el}"]`);
                if (input) input.placeholder = `${min} – ${max}`;

                // блок подсказки
                rows.push(`<div class="col-sm-4 mb-1"><strong>${el}</strong>: ${min} – ${max}</div>`);
            });

            hintDiv.innerHTML = `<div class="row mb-3">${rows.join('')}</div>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('gost').addEventListener('change', onGostChange);
            document.getElementById('grade').addEventListener('change', onGradeChange);

            // Если есть выбранные ГОСТ и марка при загрузке
            const selectedGost = "{{ selected_gost|default:'' }}";
            const selectedGrade = "{{ selected_grade|default:'' }}";
            if (selectedGost) {
                document.getElementById('gost').value = selectedGost;
                onGostChange();
                if (selectedGrade) {
                    document.getElementById('grade').value = selectedGrade;
                    onGradeChange();
                }
            }
        });
    </script>
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center mb-4">
        Прогноз механических свойств<br>
        <small class="text-muted">{{ steel_name }}</small>
    </h2>

    {% if errors %}
        <div class="alert alert-danger">
            <strong>Ошибки в составе:</strong>
            <ul class="mb-0 mt-2">
                {% for field, message in errors.items %}
                    <li><strong>{{ field }}</strong>: {{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST"
          class="card shadow-sm p-4 mx-auto"
          style="max-width: 700px;"
          onsubmit="return validateSum()">

        {% csrf_token %}

        <!-- ГОСТ / Марка -->
        {% if gosts %}
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">ГОСТ</label>
                <select id="gost" name="gost" class="form-select">
                    <option value="">— не выбран —</option>
                    {% for g in gosts %}
                        <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Марка стали</label>
                <select id="grade" name="grade" class="form-select">
                    <option value="">— не выбрана —</option>
                </select>
            </div>
        </div>
        {% endif %}

        <!-- Подсказка по диапазонам -->
        <div id="composition-hint" class="mb-4 text-muted"></div>

        <hr class="mb-4">

        <!-- Химический состав -->
        <h5 class="mb-3">Химический состав, %</h5>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">C</label>
                <input type="number" step="0.001" name="C" class="form-control"
                       value="{{ data.C|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">Mn</label>
                <input type="number" step="0.001" name="Mn" class="form-control"
                       value="{{ data.Mn|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">Si</label>
                <input type="number" step="0.001" name="Si" class="form-control"
                       value="{{ data.Si|default:0 }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">P</label>
                <input type="number" step="0.001" name="P" class="form-control"
                       value="{{ data.P|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">S</label>
                <input type="number" step="0.001" name="S" class="form-control"
                       value="{{ data.S|default:0 }}" required>
            </div>
            <div class="col">
                <label class="form-label">Ni</label>
                <input type="number" step="0.001" name="Ni" class="form-control"
                       value="{{ data.Ni|default:0 }}">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <label class="form-label">Cr</label>
                <input type="number" step="0.001" name="Cr" class="form-control"
                       value="{{ data.Cr|default:0 }}">
            </div>
            <div class="col">
                <label class="form-label">Mo</label>
                <input type="number" step="0.001" name="Mo" class="form-control"
                       value="{{ data.Mo|default:0 }}">
            </div>
            <div class="col">
                <label class="form-label">Ti</label>
                <input type="number" step="0.001" name="Ti" class="form-control"
                       value="{{ data.Ti|default:0 }}">
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
                Рассчитать свойства
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'index' %}" class="btn btn-outline-secondary">
            ← На главную
        </a>
    </div>

</div>

</body>
</html>
